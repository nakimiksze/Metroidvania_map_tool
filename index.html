<title>After the Blue マップ工房</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f1ede3;--panel:#faf7ef;--panel2:#ece7da;--line:#d6cfbe;--fg:#1c2a33;--mute:#6a7479;
  --acc:#1f78b4;--acc-fg:#fff;--acc-soft:#d8e9f5;--warn:#b5651d;--bad:#b3362f;--ok:#2d7a4f;
  --canvas:#e4dfd0;--grid:rgba(28,42,51,.10);--grid2:rgba(28,42,51,.22);--shadow:0 6px 22px rgba(28,42,51,.18);
  --ui:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a20;--panel:#1a252d;--panel2:#22303a;--line:#33444f;--fg:#e3ebef;--mute:#8fa1ab;
  --acc:#5ab0e6;--acc-fg:#0b1a24;--acc-soft:#1f3d52;--warn:#e0a35a;--bad:#ef7b72;--ok:#66c68f;
  --canvas:#0e1519;--grid:rgba(227,235,239,.09);--grid2:rgba(227,235,239,.2);--shadow:0 6px 22px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a20;--panel:#1a252d;--panel2:#22303a;--line:#33444f;--fg:#e3ebef;--mute:#8fa1ab;
  --acc:#5ab0e6;--acc-fg:#0b1a24;--acc-soft:#1f3d52;--warn:#e0a35a;--bad:#ef7b72;--ok:#66c68f;
  --canvas:#0e1519;--grid:rgba(227,235,239,.09);--grid2:rgba(227,235,239,.2);--shadow:0 6px 22px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.45;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;min-height:30px}
button:hover{border-color:var(--acc)}
button.on,button.pri{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
button.bad{color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-width:0;width:100%}
textarea{font-family:var(--mono);font-size:12px;resize:vertical}
input[type=range]{width:100%}
input[type=checkbox]{width:auto;flex:none;margin:0}
.row>input[type=checkbox]{flex:none}
.pill:empty{display:none}
label.row{flex-wrap:nowrap;align-items:flex-start}
label.row>input{margin-top:3px}
.mono{font-family:var(--mono);font-size:12px}
#app{display:flex;flex-direction:column;height:100%;min-height:0}
.top{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:10px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
#projName{width:170px;font-weight:500}
.tabs{display:flex;gap:2px;background:var(--panel2);padding:2px;border-radius:8px}
.tabs button{border:0;background:transparent;padding:5px 12px}
.tabs button.on{background:var(--acc);color:var(--acc-fg)}
.grow{flex:1}
.chip{font-size:12px;color:var(--mute);white-space:nowrap}
.chip.dirty{color:var(--warn)}.chip.okc{color:var(--ok)}
.body{flex:1;display:grid;grid-template-columns:34px var(--dl,270px) minmax(0,1fr) var(--dr,300px) 34px;min-height:0;position:relative;transition:grid-template-columns .22s ease}
.rail{background:var(--panel2);display:flex;flex-direction:column;gap:6px;padding:8px 4px;align-items:center;min-height:0;min-width:0}
.rail.l{border-right:1px solid var(--line)}.rail.r{border-left:1px solid var(--line)}
.rail button{flex:none;white-space:nowrap;writing-mode:vertical-rl;padding:12px 6px;min-height:0;letter-spacing:.16em;font-weight:500;border-radius:8px;line-height:1.2;display:block;text-align:center;inline-size:max-content;block-size:auto}
.rail button.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.bdg{display:inline-block;margin-block-start:5px;writing-mode:horizontal-tb;font-size:10px;line-height:1;background:var(--warn);color:#161616;border-radius:999px;padding:2px 5px;letter-spacing:0;font-weight:700}
.bdg:empty{display:none}.bdg.dot{padding:0;width:8px;height:8px;background:var(--acc)}
.drawer{overflow:hidden;min-width:0;background:var(--panel);transition:visibility 0s}
.drawer:not(.open){visibility:hidden;transition:visibility 0s .22s}
.drawer .side{width:270px;height:100%}.drawer.r .side{width:300px}
.side{background:var(--panel);overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:14px;min-height:0}

.side h3{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700}
.sec{display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.row>label{font-size:12px;color:var(--mute);min-width:52px}
.row>input,.row>select{flex:1}
.stage{position:relative;min-width:0;min-height:0;background:var(--canvas);overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.hud>*{pointer-events:auto}
.hud .pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;box-shadow:var(--shadow)}
.hud.br{left:auto;right:10px;top:auto;bottom:10px}
#hover{position:absolute;z-index:5;pointer-events:none;background:var(--panel);border:1px solid var(--acc);border-radius:10px;box-shadow:var(--shadow);padding:6px;max-width:92%}
#hover canvas{position:static;display:block;border-radius:5px;background:var(--canvas)}
#hover .t{font-size:12px;margin-bottom:4px;display:flex;gap:8px;justify-content:space-between}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:5px}
.sw{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:4px;text-align:left;font-size:11px;line-height:1.2;min-height:0}
.sw canvas{width:100%;height:30px;border-radius:3px;background:var(--canvas);display:block}
.sw .id{font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw .ty{color:var(--mute);font-size:10px}
.sw.on{outline:2px solid var(--acc);background:var(--acc-soft)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tools button{padding:4px 2px;font-size:12px;text-align:center}
.list{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto}
.list button{text-align:left;display:flex;gap:6px;align-items:center;border-color:transparent;background:transparent;padding:3px 6px}
.list button:hover{background:var(--panel2)}
.list button.on{background:var(--acc-soft);border-color:var(--acc)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.warnrow{font-size:12px;display:flex;gap:6px;align-items:flex-start;padding:4px 6px;border-radius:5px;text-align:left;width:100%}
.warnrow.w{background:color-mix(in srgb,var(--warn) 14%,transparent)}.warnrow.e{background:color-mix(in srgb,var(--bad) 14%,transparent)}.warnrow.i{background:var(--panel2)}
.hint{font-size:12px;color:var(--mute)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,18,24,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal>.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;min-height:0}
.box>.hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700}
.box>.bd{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.box textarea{min-height:280px;height:46vh}
kbd{font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
table.kv{border-collapse:collapse;font-size:12px}table.kv td{padding:2px 8px 2px 0;vertical-align:top}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:7px 14px;border-radius:999px;font-size:13px;z-index:80;box-shadow:var(--shadow)}
@media (max-width:980px){.body{grid-template-columns:30px minmax(0,1fr) 30px}
  .drawer{position:absolute;top:0;bottom:0;z-index:20;box-shadow:var(--shadow)}.drawer.l{left:30px}.drawer.r{right:30px}
  .drawer .side,.drawer.r .side{width:min(84vw,310px)}.drawer:not(.open){display:none}}
</style>

 <header class="top">

</div>

function ensureSlopes(p){p.meta=p.meta||{};if(p.meta.slopes)return;p.meta.slopes=1;

function emptyRows(w,h){return Array.from({length:h},()=>'.'.repeat(w))}
function tileAt(r,x,y){if(x<0||y<0||y>=r.rows.length||x>=r.rows[0].length)return'.';return r.rows[y][x]}
function setTile(r,x,y,ch){if(x<0||y<0||y>=r.rows.length||x>=r.rows[0].length)return;const s=r.rows[y];if(s[x]!==ch)r.rows[y]=s.slice(0,x)+ch+s.slice(x+1)}

function importImage(file,max,cb){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h));

  const png=/png|gif|webp|svg/.test(file.type)&&(max<=512||c.width*c.height<=512*512);const data=c.toDataURL(png?'image/png':'image/jpeg',.85);
  const id=uid('img_');P.images[id]={name:file.name,w:c.width,h:c.height,data};cb(id)};im.onerror=()=>toast('画像を読み込めませんでした');im.src=fr.result};fr.readAsDataURL(file)}

let last='',undoS=[],redoS=[],dirty=false,saveT=null;
function applyState(s){const o=JSON.parse(s);Object.assign(P,o);reidx();if(UI.room&&!P.rooms[UI.room])UI.room=null}
function commit(){const s=ser();if(s===last)return;undoS.push(last);if(undoS.length>120)undoS.shift();last=s;redoS=[];touch()}
function undo(){if(!undoS.length)return;redoS.push(last);last=undoS.pop();applyState(last);touch();refreshAll()}
function redo(){if(!redoS.length)return;undoS.push(last);last=redoS.pop();applyState(last);touch();refreshAll()}
function touch(){dirty=true;chip();clearTimeout(saveT);saveT=setTimeout(()=>saveNow(true),900);updUndo()}
function chip(msg){const c=$('#saveChip');c.className='chip'+(dirty?' dirty':' okc');c.textContent=msg||(dirty?'未保存の変更あり':'保存済み')}
function updUndo(){$('#bUndo').disabled=!undoS.length;$('#bRedo').disabled=!redoS.length}
function pack(){return JSON.stringify({...JSON.parse(ser()),v:1,tpu:TPU,images:P.images})}
/* IndexedDB (失敗時は localStorage) */
function idb(){return new Promise((res,rej)=>{try{const q=indexedDB.open('atb-map-workshop',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}})}
async function kvSet(k,v){try{const d=await idb();await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)});return true}catch(e){try{localStorage.setItem('atb:'+k,v);return true}catch(e2){return false}}}
async function kvGet(k){try{const d=await idb();return await new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){try{return localStorage.getItem('atb:'+k)}catch(e2){return null}}}
async function kvDel(k){try{const d=await idb();await new Promise(res=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=res})}catch(e){try{localStorage.removeItem('atb:'+k)}catch(e2){}}}
async function kvKeys(){try{const d=await idb();return await new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){const a=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('atb:'))a.push(k.slice(4))}}catch(e2){}return a}}
async function saveNow(auto){const ok=await kvSet('project',pack());if(ok){dirty=false;chip('保存済み '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}));if(!auto)toast('ブラウザに保存しました')}else{chip('保存失敗（容量不足）');toast('保存できませんでした。画像を減らすか、書き出しで控えを取ってください')}}
async function saveVersion(label){const k='ver:'+Date.now();const ok=await kvSet(k,JSON.stringify({label,at:Date.now(),data:pack()}));toast(ok?'版を保存しました':'版の保存に失敗しました')}
function loadPacked(txt){const o=JSON.parse(txt);if(!o.rooms||!o.blocks)throw new Error('形式が違います');
  P={v:1,name:o.name||'After the Blue',tpu:TPU,areas:o.areas||{},blocks:o.blocks,rooms:o.rooms,links:o.links||[],images:o.images||{},mapBg:o.mapBg||null,items:o.items||{},customTypes:o.customTypes||{},meta:o.meta||{}};
  ensureSlopes(P);
  for(const id in P.rooms){const r=P.rooms[id];r.id=id;r.w=r.w||1;r.h=r.h||1;r.objs=r.objs||[];r.flags=r.flags||{};if(!r.rows||r.rows.length!==CH*r.h)resizeRoom(r,r.w,r.h)}
  for(const b of P.blocks){if(b.img&&!P.images[b.img])b.img=null;if(b.cap&&!P.images[b.cap])b.cap=null}for(const id in P.rooms){const g=P.rooms[id].bg;if(g&&(!g.img||!P.images[g.img]))P.rooms[id].bg=null}if(P.mapBg&&!P.images[P.mapBg.img])P.mapBg=null;
  reidx();for(const k in imgCache)delete imgCache[k];last=ser();undoS=[];redoS=[]}

/* ===== rendering ===== */
const UI={mode:'over',room:null,tool:'sel',selRooms:[],selLink:null,selObj:null,blk:'ground_a',otype:'save',rtool:'pen',fill:true,autoSide:true,
  showGrid:true,showBg:true,showLinks:true,showFig:false,showNames:true,showObjs:true,showThumb:true,hoverOn:true,showCol:true,preview:false,showNb:true,hoverNb:null};
const V={over:{x:40,y:40,z:1},room:{x:20,y:20,z:1},world:{x:20,y:20,z:1}};
let TH={};const cv=$('#cv'),cx=cv.getContext('2d');let CWpx=0,CHpx=0,DPR=1,raf=0;
function readTheme(){const s=getComputedStyle(document.documentElement);const g=n=>s.getPropertyValue(n).trim();
  TH={bg:g('--canvas'),fg:g('--fg'),panel:g('--panel'),line:g('--line'),acc:g('--acc'),grid:g('--grid'),grid2:g('--grid2'),mute:g('--mute'),bad:g('--bad'),ok:g('--ok'),warn:g('--warn')}}
function sizeCanvas(){const st=$('#stage');DPR=Math.min(2,window.devicePixelRatio||1);CWpx=st.clientWidth;CHpx=st.clientHeight;cv.width=Math.max(1,CWpx*DPR);cv.height=Math.max(1,CHpx*DPR);redraw()}
function redraw(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;draw()})}
function mix(hex,k,to){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,t=to?255:0;const f=c=>Math.round(c+(t-c)*k);return`rgb(${f(r)},${f(g)},${f(b)})`}
function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
const ITEMICON={hp:'HP',atk:'攻',heal:'回',badge:'章',drone:'ド',shotgun:'銃'};
function objGlyph(o){if(o.type==='item'){const it=P.items[o.item];return(it&&ITEMICON[it.icon])||'◆'}if(o.type==='enemy')return'E';return OBJ[o.type]?OBJ[o.type].g:'?'}

/* --- タイル1枚 --- */
let PREVIEW=false;
const SLOPE_GEO={BR:{poly:[[0,1],[1,1],[1,0]],edge:[[0,1],[1,0]]},BL:{poly:[[0,0],[0,1],[1,1]],edge:[[0,0],[1,1]]},TR:{poly:[[0,0],[1,0],[1,1]],edge:[[0,0],[1,1]]},TL:{poly:[[0,0],[1,0],[0,1]],edge:[[1,0],[0,1]]},
  R1:{poly:[[0,1],[1,.5],[1,1]],edge:[[0,1],[1,.5]]},R2:{poly:[[0,.5],[1,0],[1,1],[0,1]],edge:[[0,.5],[1,0]]},L1:{poly:[[0,0],[1,.5],[1,1],[0,1]],edge:[[0,0],[1,.5]]},L2:{poly:[[0,.5],[1,1],[0,1]],edge:[[0,.5],[1,1]]}};
const slopeGeo=b=>SLOPE_GEO[(b.p&&b.p.shape)||'BR']||SLOPE_GEO.BR;
function slopePath(c,b,px,py,s){c.beginPath();slopeGeo(b).poly.forEach(([x,y],i)=>c[i?'lineTo':'moveTo'](px+x*s,py+y*s));c.closePath()}
function drawBlock(c,b,px,py,s,nb){
  const im=getImg(b.img),cap=getImg(b.cap);
  if(bty(b)==='platform'){
    if(im){const h=Math.min(s*2,s*im.naturalHeight/im.naturalWidth);c.drawImage(im,px,py,s,h)}
    else{const h=Math.max(3,s*.42);c.fillStyle=b.col||TYPES.platform.col;c.fillRect(px,py,s,h);
      c.fillStyle='rgba(255,255,255,.6)';c.fillRect(px,py,s,Math.max(1.5,s*.14));
      c.fillStyle='rgba(0,0,0,.4)';c.fillRect(px,py+h-Math.max(1,s*.1),s,Math.max(1,s*.1))}
    return}
  if(bty(b)==='slope'){const g=slopeGeo(b);c.save();slopePath(c,b,px,py,s);
    if(im){c.clip();c.drawImage(im,px,py,s,s)}else{c.fillStyle=b.col||TYPES.slope.col;c.fill()}
    c.restore();c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=Math.max(1,s*.1);c.beginPath();c.moveTo(px+g.edge[0][0]*s,py+g.edge[0][1]*s);c.lineTo(px+g.edge[1][0]*s,py+g.edge[1][1]*s);c.stroke();return}
  if(im){c.drawImage(im,px,py,s,s)}
  else{
    const col=b.col||TYPES[b.type].col;c.fillStyle=col;
    switch(bty(b)){
      case'decor':c.globalAlpha=.7;c.fillRect(px,py,s,s);c.globalAlpha=1;break;
      case'liquid':c.globalAlpha=.55;c.fillRect(px,py,s,s);c.globalAlpha=1;break;
      case'hazard':c.beginPath();c.moveTo(px,py+s);c.lineTo(px+s*.25,py+s*.25);c.lineTo(px+s*.5,py+s);c.lineTo(px+s*.75,py+s*.25);c.lineTo(px+s,py+s);c.closePath();c.fill();break;
      case'ladder':c.fillRect(px+s*.18,py,s*.1,s);c.fillRect(px+s*.72,py,s*.1,s);for(let i=0;i<3;i++)c.fillRect(px+s*.18,py+s*(.12+i*.32),s*.64,s*.08);break;
      default:c.fillRect(px,py,s,s)}
    if(s>=9){c.strokeStyle='rgba(0,0,0,.28)';c.lineWidth=1;
      if(bty(b)==='crumble'){c.beginPath();c.moveTo(px+s*.2,py);c.lineTo(px+s*.45,py+s*.5);c.lineTo(px+s*.3,py+s);c.moveTo(px+s*.45,py+s*.5);c.lineTo(px+s*.85,py+s*.7);c.stroke()}
      else if(bty(b)==='oneway'){c.fillStyle='rgba(255,255,255,.85)';c.font=`700 ${s*.7}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(b.p&&b.p.dir==='L'?'◀':b.p&&b.p.dir==='U'?'▲':b.p&&b.p.dir==='D'?'▼':'▶',px+s/2,py+s/2)}
      else if(bty(b)==='gate'){c.beginPath();for(let i=-s;i<s;i+=s/3){c.moveTo(px+i,py+s);c.lineTo(px+i+s,py)}c.save();c.beginPath();c.rect(px,py,s,s);c.clip();c.stroke();c.restore()}
      else if(bty(b)==='solid'){c.fillStyle='rgba(255,255,255,.14)';c.fillRect(px,py,s,Math.max(1,s*.12))}
    }
  }
  if(cap&&(!nb||nb.up)){const h=Math.min(s,s*cap.naturalHeight/cap.naturalWidth);c.drawImage(cap,px,py,s,h)}
  if(!im&&!PREVIEW&&s>=10&&b.tex){c.fillStyle=`hsl(${hashStr(b.tex)%360},70%,55%)`;c.fillRect(px,py+s-Math.max(2,s*.14),s,Math.max(2,s*.14))}
}
function drawRoomTiles(c,r,ox,oy,s){
  const lite=s<5;
  for(let y=0;y<r.rows.length;y++){const row=r.rows[y];for(let x=0;x<row.length;x++){const ch=row[x];if(ch==='.')continue;const b=BC[ch];if(!b){c.fillStyle='#f0f';c.fillRect(ox+x*s,oy+y*s,s,s);continue}
    if(lite){c.fillStyle=b.col||TYPES[b.type].col;if(bty(b)==='platform')c.fillRect(ox+x*s,oy+y*s,s,Math.max(1,s*.4));else if(bty(b)==='slope'){slopePath(c,b,ox+x*s,oy+y*s,s);c.fill()}else c.fillRect(ox+x*s,oy+y*s,s,s)}
    else{const u=y>0?row_(r,x,y-1):'.';drawBlock(c,b,ox+x*s,oy+y*s,s,{up:!(u!=='.'&&BC[u]&&bty(BC[u])!=='platform')})}}}}
function row_(r,x,y){return r.rows[y][x]}
function drawMarker(c,o,ox,oy,s,sel){
  const d=OBJ[o.type]||{col:'#888',g:'?'},px=ox+o.x*TPU*s,py=oy+o.y*TPU*s;
  const rr=Math.max(s*.62,2.2);
  if(s<5){c.fillStyle=d.col;c.fillRect(px-1,py-3,2.5,3);return}
  c.save();c.fillStyle=d.col;c.strokeStyle=sel?'#fff':'rgba(0,0,0,.45)';c.lineWidth=sel?2.5:1.2;
  c.beginPath();c.arc(px,py-rr*1.15,rr,0,7);c.fill();c.stroke();
  c.beginPath();c.moveTo(px-rr*.35,py-rr*.35);c.lineTo(px,py);c.lineTo(px+rr*.35,py-rr*.35);c.fillStyle=d.col;c.fill();
  c.fillStyle='#fff';c.font=`700 ${rr*(objGlyph(o).length>1?.8:1.05)}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(objGlyph(o),px,py-rr*1.12);
  c.restore()}
function bgSize(r,im){const w=r.bg.w||CW*r.w;return[w,w*im.naturalHeight/im.naturalWidth]}
function drawBg(c,r,ox,oy,s,front){if(!r.bg||!r.bg.img||!!r.bg.front!==!!front)return;const im=getImg(r.bg.img);if(!im)return;const[w,h]=bgSize(r,im);c.globalAlpha=r.bg.alpha??1;
  c.drawImage(im,ox+(r.bg.x||0)*s,oy+(r.bg.y||0)*s,w*s,h*s);c.globalAlpha=1}
/* --- 部屋の縮小画像キャッシュ --- */
const thumbC={};
function thumb(r){const key=r.rows.join('')+r.objs.length+(r.bg?(r.bg.front?'F':'')+r.bg.img+r.bg.x+r.bg.y+r.bg.w+r.bg.alpha+(getImg(r.bg.img)?1:0):'')+r.area+(P.areas[r.area]||{}).col+P.blocks.length+(P.blocks.map(b=>b.col+b.img+b.cap+(getImg(b.img)?1:0)+(getImg(b.cap)?1:0)).join(''));
  let t=thumbC[r.id];if(t&&t.key===key&&!t.dirtyImg)return t.cv;
  const s=2,w=rTW(r)*s,h=rTH(r)*s;const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  const a=P.areas[r.area]||{col:'#777'};g.fillStyle=mix(a.col,.55,false);g.fillRect(0,0,w,h);
  if(r.bg&&r.bg.img&&!getImg(r.bg.img)){}
  drawBg(g,r,0,0,s);drawRoomTiles(g,r,0,0,s);drawBg(g,r,0,0,s,true);for(const o of r.objs)drawMarker(g,o,0,0,s);
  thumbC[r.id]={key,cv:c};return c}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

/* --- 概要マップの幾何 --- */
function rectOf(r){return{x:r.gx*OV.W+OV.m,y:r.gy*OV.H+OV.m,w:r.w*OV.W-OV.m*2,h:r.h*OV.H-OV.m*2}}
function adjPair(a,b){for(const[ax,ay]of cellsOf(a))for(const[bx,by]of cellsOf(b)){const dx=bx-ax,dy=by-ay;if(Math.abs(dx)+Math.abs(dy)===1)return{ax,ay,bx,by,dx,dy}}return null}
function linkGeom(l){const a=room(l.a),b=room(l.b);if(!a||!b)return null;const p=adjPair(a,b);
  if(p){const m=OV.m;let x,y,w,h;
    if(p.dx!==0){x=Math.max(p.ax,p.bx)*OV.W-m;y=p.ay*OV.H+OV.H/2-11;w=m*2;h=22}
    else{x=p.ax*OV.W+OV.W/2-17;y=Math.max(p.ay,p.by)*OV.H-m;w=34;h=m*2}
    return{adj:true,x,y,w,h,cx:x+w/2,cy:y+h/2,dx:p.dx,dy:p.dy}}
  const ra=rectOf(a),rb=rectOf(b),ax=ra.x+ra.w/2,ay=ra.y+ra.h/2,bx=rb.x+rb.w/2,by=rb.y+rb.h/2;
  return{adj:false,ax,ay,bx,by,cx:(ax+bx)/2,cy:(ay+by)/2,dx:Math.sign(bx-ax),dy:Math.sign(by-ay)}}
function tri(c,x,y,dx,dy,sz,col){c.save();c.translate(x,y);c.rotate(Math.atan2(dy,dx));c.beginPath();c.moveTo(sz,0);c.lineTo(-sz*.7,-sz*.75);c.lineTo(-sz*.7,sz*.75);c.closePath();c.fillStyle=col;c.fill();c.restore()}
function worldToScr(v,x,y){return[x*v.z+v.x,y*v.z+v.y]}
function scrToWorld(v,x,y){return[(x-v.x)/v.z,(y-v.y)/v.z]}
function begin(v){cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle=TH.bg;cx.fillRect(0,0,CWpx,CHpx);cx.setTransform(DPR*v.z,0,0,DPR*v.z,DPR*v.x,DPR*v.y)}

let drag=null,hoverRoom=null,hoverLink=null,mouse={x:0,y:0};
function drawOverview(){
  const v=V.over;begin(v);
  if(P.mapBg&&P.mapBg.img&&UI.showBg){const im=getImg(P.mapBg.img);if(im){cx.globalAlpha=P.mapBg.alpha??.5;cx.drawImage(im,P.mapBg.x||0,P.mapBg.y||0,im.naturalWidth*(P.mapBg.scale||1),im.naturalHeight*(P.mapBg.scale||1));cx.globalAlpha=1}}
  // grid
  const x0=Math.floor(-v.x/v.z/OV.W)-1,x1=Math.ceil((CWpx-v.x)/v.z/OV.W)+1,y0=Math.floor(-v.y/v.z/OV.H)-1,y1=Math.ceil((CHpx-v.y)/v.z/OV.H)+1;
  cx.strokeStyle=TH.grid;cx.lineWidth=1/v.z;cx.beginPath();for(let i=x0;i<=x1;i++){cx.moveTo(i*OV.W,y0*OV.H);cx.lineTo(i*OV.W,y1*OV.H)}for(let j=y0;j<=y1;j++){cx.moveTo(x0*OV.W,j*OV.H);cx.lineTo(x1*OV.W,j*OV.H)}cx.stroke();
  // links
  for(const l of P.links){const g=linkGeom(l);if(!g)continue;const sel=UI.selLink===l.id,hov=hoverLink===l.id;const col=sel?TH.acc:hov?TH.acc:TH.mute;
    cx.fillStyle=col;cx.strokeStyle=col;
    if(g.adj){if(l.kind==='shortcut'){cx.globalAlpha=.55}cx.fillRect(g.x,g.y,g.w,g.h);cx.globalAlpha=1}
    else{cx.lineWidth=3;cx.setLineDash(l.kind==='shortcut'?[3,4]:[8,5]);cx.beginPath();cx.moveTo(g.ax,g.ay);cx.lineTo(g.bx,g.by);cx.stroke();cx.setLineDash([])}
    if(l.kind==='drop'||l.kind==='oneway'){const a=room(l.a),b=room(l.b);let dx=g.dx,dy=g.dy;if(!g.adj){const ex=g.bx-g.ax,ey=g.by-g.ay;dx=ex;dy=ey}else{const pa=adjPair(a,b);dx=pa.dx;dy=pa.dy}
      tri(cx,g.cx,g.cy,dx,dy,5.5,sel||hov?'#fff':TH.fg)}
    if(sel){cx.lineWidth=2/v.z;cx.strokeStyle='#fff';if(g.adj)cx.strokeRect(g.x-2,g.y-2,g.w+4,g.h+4)}}
  // rooms
  const selSet=new Set(UI.selRooms);
  for(const id in P.rooms){const r=P.rooms[id];let rc=rectOf(r);let dx=0,dy=0;
    if(drag&&drag.k==='move'&&selSet.has(id)){dx=drag.dx*OV.W;dy=drag.dy*OV.H}
    const a=P.areas[r.area]||{col:'#777'};
    cx.save();rrect(cx,rc.x+dx,rc.y+dy,rc.w,rc.h,9);cx.fillStyle=mix(a.col,.5,false);cx.fill();cx.clip();
    if(UI.showThumb){const t=thumb(r);cx.globalAlpha=.95;cx.drawImage(t,rc.x+dx,rc.y+dy,rc.w,rc.h);cx.globalAlpha=1}
    cx.restore();
    rrect(cx,rc.x+dx,rc.y+dy,rc.w,rc.h,9);cx.lineWidth=selSet.has(id)?3:2;cx.strokeStyle=selSet.has(id)?'#fff':hoverRoom===id?TH.acc:a.col;cx.stroke();
    if(selSet.has(id)){rrect(cx,rc.x+dx-2,rc.y+dy-2,rc.w+4,rc.h+4,11);cx.lineWidth=1.5;cx.strokeStyle=TH.acc;cx.stroke()}
    // 記号
    const sx=rc.x+dx,sy=rc.y+dy;cx.font='700 9px sans-serif';cx.textBaseline='middle';cx.textAlign='center';
    const has=t=>r.objs.some(o=>o.type===t);
    const sym=(ch,x,y,col)=>{cx.fillStyle=col;cx.beginPath();cx.arc(x,y,6,0,7);cx.fill();cx.fillStyle='#fff';cx.fillText(ch,x,y+.5)};
    if(has('save'))sym('S',sx+9,sy+rc.h-9,'#d39a1d');if(has('warp'))sym('W',sx+rc.w-9,sy+rc.h-9,'#8e4dc4');if(r.flags&&r.flags.goal)sym('⚑',sx+rc.w-9,sy+9,'#2c8d3c');

function checkHTML(li){return`<div class="sec"><h3>チェック (${li.filter(x=>x.lv!=='i').length})</h3><div class="hint">重複ID・壁で塞がった出入口・地形へのめり込みなどを自動で点検します。項目をクリックすると該当箇所へ移動します。</div><div class="list" style="max-height:none" id="lint">${li.length?li.map((x,i)=>`<button class="warnrow ${x.lv}" data-lint="${i}">${x.lv==='e'?'⛔':x.lv==='w'?'⚠':'ℹ'} <span>${esc(x.msg)}</span></button>`).join(''):'<div class="hint">問題は見つかりません。</div>'}</div></div>`}
function lint(){const o=[];const ids={};
  for(const id in P.rooms){const r=P.rooms[id];
    for(const ob of r.objs){if(ids[ob.id])o.push({lv:'e',msg:`オブジェクトID重複: ${ob.id}（${ids[ob.id]} と ${r.name}）`,room:id,obj:ob.id});ids[ob.id]=r.name;
      if(ob.x<0||ob.y<0||ob.x*TPU>rTW(r)||ob.y*TPU>rTH(r))o.push({lv:'e',msg:`${r.name}: ${ob.id} が部屋の外`,room:id,obj:ob.id});
      if(['save','warp','entrance','respawn','enemy'].includes(ob.type)&&tileAt(r,Math.floor(ob.x*TPU),Math.floor(ob.y*TPU-.01))!=='.'&&(q=>q&&bty(q)==='solid')(BC[tileAt(r,Math.floor(ob.x*TPU),Math.floor(ob.y*TPU-.01))]))o.push({lv:'w',msg:`${r.name}: ${ob.id} が地形の中にめり込んでいます`,room:id,obj:ob.id})}
    const items=r.objs.filter(q=>q.type==='item'&&!P.items[q.item]?.cat?.includes('消費'));if(items.length>1)o.push({lv:'w',msg:`${r.name}: 強化/装備アイテムが${items.length}個（1セル1個の方針）`,room:id});
    if(r.objs.some(q=>q.type==='save')&&r.objs.filter(q=>q.type==='save').length>1)o.push({lv:'w',msg:`${r.name}: セーブが複数`,room:id});
    for(const q of roomEnds(r)){const n=edgeBlocked(r,q.e);if(n)o.push({lv:'w',msg:`${r.name}: 「${room(q.other)?.name||q.other}」への出入口に壁タイルが${n}枚`,room:id,link:q.l.id});
      const lim='LR'.includes(q.e.side)?rTH(r):rTW(r);if(q.e.from<0||q.e.to>lim||q.e.to<=q.e.from)o.push({lv:'e',msg:`${r.name}: 出入口の範囲が不正 (${q.e.from}-${q.e.to})`,room:id,link:q.l.id})}
    if(!linksOf(id).length)o.push({lv:'i',msg:`${r.name}: どことも接続されていません`,room:id});
    for(let j=0;j<r.rows.length;j++)for(let i=0;i<r.rows[j].length;i++){const c=r.rows[j][i];if(c!=='.'&&!BC[c]){o.push({lv:'e',msg:`${r.name}: 未定義のブロック文字 '${c}' (${i},${j})`,room:id});j=1e9;break}}}
  for(const l of P.links){const a=room(l.a),b=room(l.b);if(!a||!b){o.push({lv:'e',msg:`接続 ${l.id}: 部屋が存在しません`,link:l.id});continue}
    const p=adjPair(a,b);if(p){const sa=p.dx===1?'R':p.dx===-1?'L':p.dy===1?'B':'T';if(l.ea.side!==sa||l.eb.side!==OPP[sa])o.push({lv:'w',msg:`接続 ${a.name}⇄${b.name}: 隣り合っているのに出入口の辺が合っていません`,link:l.id})}
    else o.push({lv:'i',msg:`接続 ${a.name}⇄${b.name}: 隣接していない(線で表示)`,link:l.id});
    if(p&&l.kind!=='drop'&&'LR'.includes(l.ea.side)&&'LR'.includes(l.eb.side)&&(l.ea.from!==l.eb.from||l.ea.to!==l.eb.to))o.push({lv:'i',msg:`接続 ${a.name}⇄${b.name}: 両側の出入口の高さが違います`,link:l.id})}
  const used={};for(const b of P.blocks){(used[b.ch]=used[b.ch]||[]).push(b.id)}for(const c in used)if(used[c].length>1)o.push({lv:'e',msg:`ブロック文字 '${c}' が重複: ${used[c].join(', ')}`});
  return o}

/* ===== 追加機能: 合成 / 直線接続 / 種類管理 / 出入口 / 保存 ===== */
UI.merge=false;UI.mergeSel=[];UI.arm=null;

/* --- 出入口の壁を開ける --- */
function carveEnd(r,e){const tw=rTW(r),th=rTH(r),depth=e.side==='B'?2:1;let n=0;
  for(let i=Math.floor(e.from);i<Math.ceil(e.to);i++)for(let d=0;d<depth;d++){
    const x=e.side==='L'?d:e.side==='R'?tw-1-d:i,y=e.side==='T'?d:e.side==='B'?th-1-d:i;
    const b=BC[tileAt(r,x,y)];if(b&&['solid','crumble'].includes(bty(b))){setTile(r,x,y,'.');n++}}return n}
/* --- 部屋の合成 --- */
function toggleMerge(on){UI.merge=on===undefined?!UI.merge:on;UI.mergeSel=[];if(UI.merge){UI.tool='sel';UI.selRooms=[];UI.selLink=null;drag=null;toast('合成モード：つなげたい隣どうしの部屋を順にクリック → Enterで決定 / Escで中止')}refreshPanels()}
function mergePick(id){const i=UI.mergeSel.indexOf(id);if(i>=0)UI.mergeSel.splice(i,1);else UI.mergeSel.push(id);hud();redraw()}
function mergeRooms(ids){
  const rs=ids.map(room).filter(Boolean);if(rs.length<2)return{err:'2部屋以上を選んでください'};
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const set=new Set();
  for(const r of rs)for(const[x,y]of cellsOf(r)){set.add(x+','+y);x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  const W=x1-x0+1,H=y1-y0+1;if(set.size!==W*H)return{err:'合成後が長方形になりません（隙間や飛び出しがあります）'};
  const sorted=rs.slice().sort((a,b)=>a.gy-b.gy||a.gx-b.gx),base=sorted[0],idset=new Set(ids);
  // 内部の接続: 出入口の壁を開けてから結合
  for(const l of P.links)if(idset.has(l.a)&&idset.has(l.b)){carveEnd(room(l.a),l.ea);carveEnd(room(l.b),l.eb)}
  const tw=CW*W,th=CH*H,grid=Array.from({length:th},()=>Array(tw).fill('.')),objs=[];let bg=null;const fl={goal:false,pit:'',bgm:''},notes=[];
  for(const r of sorted){const ox=(r.gx-x0)*CW,oy=(r.gy-y0)*CH;
    r.rows.forEach((row,j)=>{for(let i=0;i<row.length;i++)if(row[i]!=='.'||!grid[oy+j][ox+i])grid[oy+j][ox+i]=row[i]});
    for(const o of r.objs){const c=clone(o);c.x=+(c.x+ox/TPU).toFixed(2);c.y=+(c.y+oy/TPU).toFixed(2);objs.push(c)}
    if(!bg&&r.bg&&r.bg.img){bg=clone(r.bg);bg.x=(bg.x||0)+ox;bg.y=(bg.y||0)+oy}
    const f=r.flags||{};fl.goal=fl.goal||!!f.goal;fl.pit=fl.pit||f.pit||'';fl.bgm=fl.bgm||f.bgm||'';if(r.note)notes.push(r.note)}
  // 外部の接続: 出入口位置をずらす
  const off=r=>[(r.gx-x0)*CW,(r.gy-y0)*CH];
  P.links=P.links.filter(l=>!(idset.has(l.a)&&idset.has(l.b)));
  for(const l of P.links){for(const w of['a','b']){if(!idset.has(l[w]))continue;const r=room(l[w]),e=w==='a'?l.ea:l.eb,[dx,dy]=off(r),d='LR'.includes(e.side)?dy:dx;e.from+=d;e.to+=d;l[w]=base.id}}
  for(const r of sorted)if(r!==base){delete P.rooms[r.id];delete thumbC[r.id]}
  base.w=W;base.h=H;base.gx=x0;base.gy=y0;base.rows=grid.map(a=>a.join(''));base.objs=objs;base.bg=bg;base.flags=fl;base.note=notes.join('\n');delete thumbC[base.id];
  return{id:base.id,n:rs.length}}
function doMerge(){const r=mergeRooms(UI.mergeSel);if(r.err){toast(r.err);return}UI.merge=false;UI.mergeSel=[];UI.selRooms=[r.id];UI.selLink=null;commit();refreshAll();toast(r.n+'部屋を合成しました（内部の出入口は壁を開けています。Ctrl+Zで戻せます）')}

const hasLink=(a,b)=>P.links.some(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a));
function lineCells(c0,wx,wy){const gx=Math.floor(wx/OV.W),gy=Math.floor(wy/OV.H),dx=gx-c0[0],dy=gy-c0[1],cells=[];
  if(Math.abs(dx)>=Math.abs(dy)){const s=dx<0?-1:1;for(let x=c0[0];x!==gx+s;x+=s)cells.push([x,c0[1]])}else{const s=dy<0?-1:1;for(let y=c0[1];y!==gy+s;y+=s)cells.push([c0[0],y])}return cells}
function planLink(d,wx,wy){const gx=Math.floor(wx/OV.W),gy=Math.floor(wy/OV.H),tgt=hitRoomW(wx,wy);
  if(tgt&&tgt!==d.from&&gx!==d.c0[0]&&gy!==d.c0[1])return{rooms:[d.from,tgt],pairs:[[d.from,tgt]]};
  const seq=[];let gap=false;
  for(const[x,y]of lineCells(d.c0,wx,wy)){const r=roomAtCell(x,y);if(!r){gap=true;continue}const last=seq[seq.length-1];if(last&&last.id===r.id)continue;seq.push({id:r.id,gap:last?gap:false});gap=false}
  const pairs=[];for(let i=1;i<seq.length;i++)if(!seq[i].gap)pairs.push([seq[i-1].id,seq[i].id]);
  if(seq.length===2&&!pairs.length)pairs.push([seq[0].id,seq[1].id]);
  return{rooms:seq.map(s=>s.id),pairs}}
function execLink(p,del){let n=0,last=null;
  if(del){const b=P.links.length;P.links=P.links.filter(l=>!p.pairs.some(([a,c])=>(l.a===a&&l.b===c)||(l.a===c&&l.b===a)));n=b-P.links.length;UI.selLink=null}
  else for(const[a,b]of p.pairs)if(!hasLink(a,b)){last=mkLink(a,b);n++}
  if(n){if(!del&&n===1)UI.selLink=last.id;UI.selRooms=[];commit();refreshAll();toast(del?n+'件の接続を切断しました':n+'件の接続を作りました')}
  else toast(del?'切断する接続がありません':'新しくつなぐ部屋がありません（既に接続済み、または間に空きがあります）')}
function drawLinkPreview(){const d=drag,p=planLink(d,d.wx,d.wy),col=d.del?TH.bad:TH.acc;
  cx.lineWidth=3;cx.strokeStyle=col;cx.setLineDash([6,4]);cx.beginPath();
  for(const[a,b]of p.pairs){const ra=rectOf(room(a)),rb=rectOf(room(b));cx.moveTo(ra.x+ra.w/2,ra.y+ra.h/2);cx.lineTo(rb.x+rb.w/2,rb.y+rb.h/2)}
  if(!p.pairs.length){const rc=rectOf(room(d.from));cx.moveTo(rc.x+rc.w/2,rc.y+rc.h/2);cx.lineTo(d.wx,d.wy)}
  cx.stroke();cx.setLineDash([]);
  for(const id of p.rooms){const rc=rectOf(room(id));rrect(cx,rc.x-2,rc.y-2,rc.w+4,rc.h+4,11);cx.lineWidth=2.5;cx.strokeStyle=col;cx.stroke()}}

async function saveFile(filename,text){
  filename=String(filename).replace(/[\\/:*?"<>|]/g,'_');let dl=null;
  try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename,data:text});toast('保存しました: '+filename)}catch(e){toast(e&&e.code==='declined'?'保存を取りやめました':'保存できませんでした（'+((e&&e.code)||'error')+'）。「コピー」を使ってください')}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();toast('ダウンロードしました: '+filename)}catch(e){toast('この環境では保存できません。「コピー」を使ってください')}}

/* ===== AI用Markdownの読み込み ===== */
const mdCells=l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(s=>s.trim());
function mdTable(lines,need){for(let i=0;i<lines.length-1;i++){if(!/^\s*\|/.test(lines[i]))continue;if(!/^\s*\|[\s:|-]+\|?\s*$/.test(lines[i+1]))continue;
    const h=mdCells(lines[i]);if(need&&!need.every(n=>h.includes(n)))continue;const rows=[];let j=i+2;
    while(j<lines.length&&/^\s*\|/.test(lines[j])){const c=mdCells(lines[j]);const o={};h.forEach((k,x)=>o[k]=c[x]??'');rows.push(o);j++}return rows}return null}
const parseExit=s=>{const m=String(s||'').match(/^([LRTB])\s+(-?\d+)\.\.(-?\d+)$/);return m?{side:m[1],from:+m[2],to:+m[3]}:null};
function parseRoomSec(sec,warn){
  const lines=sec.replace(/\r/g,'').split('\n'),head=lines[0].trim(),hm=head.match(/^(.+?) — (.*)$/),id=(hm?hm[1]:head).trim(),name=hm?hm[2].trim():id;
  const r={id,name,area:'',gx:0,gy:0,w:1,h:1,rows:null,objs:[],bg:null,flags:{goal:false,pit:'',bgm:''},note:'',_bg:null};let mm;
  for(const ln of lines){
    if(mm=ln.match(/^- area: (\S+)/))r.area=mm[1];
    else if(mm=ln.match(/^- overview cell: \((-?\d+),\s*(-?\d+)\), size (\d+)x(\d+)/)){r.gx=+mm[1];r.gy=+mm[2];r.w=+mm[3];r.h=+mm[4]}
    else if(mm=ln.match(/^- flags: (.*)$/)){for(const f of mm[1].split(',').map(s=>s.trim())){if(f==='goal')r.flags.goal=true;else if(f.startsWith('pit='))r.flags.pit=f.slice(4);else if(f.startsWith('bgm='))r.flags.bgm=f.slice(4)}}
    else if(mm=ln.match(/^- note: (.*)$/))r.note=mm[1].replace(/\\n/g,'\n');
    else if(mm=ln.match(/^- background image: yes \(x=(-?[\d.]+), y=(-?[\d.]+), w=([\d.]+|fit)[^,]*, alpha=([\d.]+)/))r._bg={x:+mm[1],y:+mm[2],w:mm[3]==='fit'?null:+mm[3],alpha:+mm[4]}}
  // ASCII
  const f0=lines.findIndex(l=>l.startsWith('```'));
  if(f0>=0){let f1=lines.findIndex((l,i)=>i>f0&&l.startsWith('```'));if(f1<0)f1=lines.length;const body=lines.slice(f0+1,f1);const rows=[];
    let k=0;if(body.length&&body[0].startsWith('    '))k=2;
    for(;k<body.length;k++){const m=body[k].match(/^\s*\d+ (.*)$/);if(m)rows.push(m[1].replace(/\s+$/,''))}
    r.rows=rows}
  const tw=CW*r.w,th=CH*r.h;
  if(!r.rows||!r.rows.length){warn.push(`${id}: 地形(ASCII)が見つからないので空にしました`);r.rows=emptyRows(tw,th)}
  else{if(r.rows.length!==th)warn.push(`${id}: 行数が${r.rows.length}（期待${th}）→調整しました`);
    if(r.rows.some(s=>s.length!==tw))warn.push(`${id}: 幅が${tw}タイルでない行があります→調整しました`);
    const n=[];for(let y=0;y<th;y++){let s=(r.rows[y]||'').slice(0,tw);n.push(s+'.'.repeat(tw-s.length))}r.rows=n}
  // objects
  const t=mdTable(lines,['id','type','x','y']);
  if(t)for(const q of t){const o={id:q.id,type:q.type,x:parseFloat(q.x),y:parseFloat(q.y),label:''};if(!q.id||isNaN(o.x)||isNaN(o.y)){warn.push(`${id}: 不正なオブジェクト行 (${q.id||'?'})`);continue}
    for(const part of String(q.detail||'').split('; ')){const e=part.indexOf('=');if(e<0)continue;const k=part.slice(0,e).trim(),v=part.slice(e+1).trim();
      if(k==='item'){const m=v.match(/^([^()]+)(?:\((.*)\))?$/);o.item=m[1].trim();if(m[2])(r._items=r._items||{})[o.item]=m[2]}
      else if(k==='face')o.face=parseInt(v);else if(k==='cons')o.cons=true;else if(['kind','mode','gate','cond','label'].includes(k))o[k]=v}
    r.objs.push(o)}
  return r}
function parseAIMd(txt){
  const t=txt.replace(/\r/g,''),warn=[];
  const secs=t.split(/^## /m).slice(1),S=n=>secs.find(s=>s.startsWith(n+'.'));
  const s1=S(1);if(!s1)throw new Error('「## 1. Block legend」が見つかりません（AI用の書き出しではありません）');
  const nm=t.match(/^# (.+?) — map data/m);
  const o={name:nm?nm[1]:'After the Blue',areas:{},blocks:[],rooms:{},links:[],mapBg:null,items:{},customTypes:{},images:{}};
  // blocks
  const l1=s1.split('\n'),bt=mdTable(l1,['char','block id','type']);if(!bt)throw new Error('ブロック凡例の表が読めません');
  for(const q of bt){const ch=q.char.replace(/`/g,'');let p={};try{p=JSON.parse(q.params||'{}')}catch(e){}
    if(!ch||ch.length!==1){warn.push('ブロック文字が不正: '+q.char);continue}
    o.blocks.push({id:q['block id'],ch,type:(q.type||'solid').split(/\s+/)[0],tex:q['texture id']||'',name:q.name||q['block id'],col:q.color||null,img:null,cap:null,p})}
  const tl=l1.find(l=>l.startsWith('Block types'));
  if(tl)for(const it of tl.slice(tl.indexOf(':')+1).split(', ')){const m=it.trim().match(/^([^=\s]+)=(.*?)(?: \[custom, behaves as (\w+)(?:, color (#[0-9a-fA-F]{3,8}))?\])?$/);if(m&&m[3])o.customTypes[m[1]]={jp:m[2],base:m[3],col:m[4]||'#888888'}}
  for(const b of o.blocks)if(!BUILTIN_T.has(b.type)&&!o.customTypes[b.type]){warn.push(`ブロック ${b.id}: 未定義の種類 ${b.type}→solidにしました`);b.type='solid'}
  // areas
  const s3=S(3);if(s3)for(const ln of s3.split('\n')){const m=ln.match(/^- ([^:]+): (.*) \((#[0-9a-fA-F]{3,8})\)\s*$/);if(m)o.areas[m[1].trim()]={name:m[2],col:m[3]}}
  // links
  const s6=S(6);if(s6){const lt=mdTable(s6.split('\n'),['id','from','to','kind']);
    if(lt)for(const q of lt){const ea=parseExit(q['a exit']),eb=parseExit(q['b exit']);if(!ea||!eb){warn.push('接続 '+q.id+': 出入口が読めません');continue}
      o.links.push({id:q.id,a:q.from,b:q.to,kind:KINDS[q.kind]?q.kind:'normal',gate:q.gate||'',req:q['req a→b']||'',rreq:q['req b→a']||'',ea,eb})}}
  // rooms
  const s7=S(7);if(!s7)throw new Error('「## 7. Rooms」が見つかりません');
  for(const rs of s7.split(/^### /m).slice(1)){const r=parseRoomSec(rs,warn);if(o.rooms[r.id])warn.push('部屋IDが重複: '+r.id);o.rooms[r.id]=r}
  if(!Object.keys(o.rooms).length)throw new Error('部屋が1つも読めませんでした');
  for(const id in o.rooms){const r=o.rooms[id];if(!r.area)r.area=Object.keys(o.areas)[0]||'area_1';if(!o.areas[r.area]){o.areas[r.area]={name:r.area,col:'#888888'};warn.push('エリア '+r.area+' を新規作成')}
    for(const k in (r._items||{}))o.items[k]=o.items[k]||{name:r._items[k],cat:'',icon:''}}
  o.links=o.links.filter(l=>{const ok=o.rooms[l.a]&&o.rooms[l.b];if(!ok)warn.push('接続 '+l.id+': 存在しない部屋を参照→除外');return ok});
  return{o,warn}}
function mdToPacked(txt){
  const{o,warn}=parseAIMd(txt);
  for(const b of o.blocks){const ob=P.blocks.find(x=>x.id===b.id);if(ob){if(!b.col)b.col=ob.col;b.img=ob.img||null;b.cap=ob.cap||null}
    if(!b.col)b.col=(o.customTypes[b.type]&&o.customTypes[b.type].col)||(TYPES[b.type]&&TYPES[b.type].col)||'#888888'}
  for(const k in P.items)if(!o.items[k])o.items[k]=P.items[k];
  for(const k in o.items)if(P.items[k]&&!o.items[k].cat)o.items[k]=P.items[k];
  o.images=P.images;o.mapBg=P.mapBg;o.meta={slopes:1};
  for(const id in o.rooms){const r=o.rooms[id];r.id=id;if(r._bg){const ob=P.rooms[id];if(ob&&ob.bg&&ob.bg.img)r.bg={img:ob.bg.img,x:r._bg.x,y:r._bg.y,w:r._bg.w||CW*r.w,alpha:r._bg.alpha}}delete r._bg;delete r._items}
  return{json:JSON.stringify(o),warn,rooms:Object.keys(o.rooms).length,links:o.links.length,blocks:o.blocks.length}}
/* 部屋単位の書き出し（### 見出し + block legend）を現在のプロジェクトへ追加/上書き */
function importRoomsMd(txt,dry){
  const t=txt.replace(/\r/g,''),warn=[],leg={};
  for(const ln of t.split('\n')){const m=ln.match(/^(\S) = (\S+) \((\w+), tex=(.*)\)$/);if(m)leg[m[1]]={id:m[2],type:m[3],tex:m[4]}}
  const parts=t.split(/^### /m).slice(1);if(!parts.length)throw new Error('「### 部屋ID — 名前」の見出しが見つかりません');
  const rooms=parts.map(p=>parseRoomSec(p.split(/^--- block legend ---/m)[0],warn));
  if(dry)return{n:rooms.length,warn,ids:rooms.map(r=>r.id)};
  const map={};
  for(const ch in leg){let b=P.blocks.find(x=>x.id===leg[ch].id);
    if(!b){const used=new Set(P.blocks.map(q=>q.ch));const nc=used.has(ch)?[...CHARS].find(c=>!used.has(c)):ch;
      b={id:leg[ch].id,ch:nc,type:TYPES[leg[ch].type]?leg[ch].type:'solid',tex:leg[ch].tex,name:leg[ch].id,col:(TYPES[leg[ch].type]||TYPES.solid).col,img:null,cap:null,p:{}};P.blocks.push(b);reidx();warn.push('ブロック '+b.id+' を新規作成')}
    map[ch]=b.ch}
  for(const r of rooms){r.rows=r.rows.map(s=>[...s].map(c=>c==='.'?'.':(map[c]||c)).join(''));
    if(!P.areas[r.area]){const k=Object.keys(P.areas)[0];if(r.area)warn.push(`エリア ${r.area} が無いので ${k} にしました`);r.area=k}
    for(const k in (r._items||{}))if(!P.items[k])P.items[k]={name:r._items[k],cat:'',icon:''};
    const old=P.rooms[r.id];if(r._bg&&old&&old.bg&&old.bg.img)r.bg={img:old.bg.img,x:r._bg.x,y:r._bg.y,w:r._bg.w||CW*r.w,alpha:r._bg.alpha};
    delete r._bg;delete r._items;
    let clash=cellsOf(r).some(([x,y])=>roomAtCell(x,y,r.id));
    if(clash){let mx=-1e9,my=1e9;for(const q of Object.values(P.rooms))if(q.id!==r.id){mx=Math.max(mx,q.gx+q.w);my=Math.min(my,q.gy)}r.gx=mx;r.gy=my;warn.push(r.id+': 位置が他の部屋と重なるので右端に置きました')}
    delete thumbC[r.id];P.rooms[r.id]=r}
  return{n:rooms.length,warn}}

const README_EN='Coordinates: tile (x,y) origin top-left, x right, y down. 1 unit = '+TPU+' tiles. One map cell = 16x9 units = '+CW+'x'+CH+' tiles. Object x,y are in units (y = feet/bottom anchor). tile rows use block chars from "blocks"; "." is empty.';
function exportJSON(light){const o=JSON.parse(ser());o._readme=README_EN;o.format='atb-map-v1';o.tpu=TPU;o.cell={tiles:[CW,CH],units:[16,9]};
  if(light){o.blocks=o.blocks.map(b=>({...b,img:b.img?'(texture image omitted)':null,cap:b.cap?'(omitted)':null}));for(const id in o.rooms){const r=o.rooms[id];if(r.bg)r.bg={...r.bg,img:r.bg.img?'(omitted)':null}}if(o.mapBg)o.mapBg={...o.mapBg,img:'(omitted)'}}

function ruler(w){let a='    ',b='    ';for(let i=0;i<w;i++){a+=i%10===0?String(Math.floor(i/10)%10):' ';b+=i%10}return a+'\n'+b}
function roomAI(r){const a=P.areas[r.area]||{name:r.area};let s=`### ${r.id} — ${r.name}\n- area: ${r.area} (${a.name})\n- overview cell: (${r.gx}, ${r.gy}), size ${r.w}x${r.h} cells = ${rTW(r)}x${rTH(r)} tiles = ${rTW(r)/TPU}x${rTH(r)/TPU} units\n`;
  const fl=r.flags||{};const f=[];if(fl.goal)f.push('goal');if(fl.pit)f.push('pit='+fl.pit);if(fl.bgm)f.push('bgm='+fl.bgm);if(f.length)s+=`- flags: ${f.join(', ')}\n`;if(r.note)s+=`- note: ${r.note.replace(/\n/g,'\\n')}\n`;
  s+=`- background image: ${r.bg&&r.bg.img?'yes (x='+r.bg.x+', y='+r.bg.y+', w='+(r.bg.w||'fit')+' tiles, alpha='+r.bg.alpha+')':'none'}\n`;
  s+='\n```\n'+ruler(rTW(r))+'\n'+r.rows.map((x,i)=>String(i).padStart(3,' ')+' '+x).join('\n')+'\n```\n';
  const cnt={};for(const row of r.rows)for(const c of row)if(c!=='.')cnt[c]=(cnt[c]||0)+1;
  if(Object.keys(cnt).length)s+='\nblock counts: '+Object.entries(cnt).map(([c,n])=>`${(BC[c]||{id:'?'+c}).id}=${n}`).join(', ')+'\n';
  const ends=roomEnds(r);if(ends.length){s+='\nexits:\n';for(const q of ends){const o=room(q.other);s+=`- ${SIDES[q.e.side]}(${q.e.side}) tiles ${q.e.from}..${q.e.to} → ${q.other}${o?' ('+o.name+')':''} [${q.l.id}, ${q.l.kind}${q.l.gate?', gate='+q.l.gate:''}]\n`}}
  if(r.objs.length){s+='\nobjects (x,y in units; tile = unit*'+TPU+'):\n| id | type | x | y | tile | detail |\n|---|---|---|---|---|---|\n';
    for(const o of r.objs){const d=[];if(o.kind)d.push('kind='+o.kind);if(o.item)d.push('item='+o.item+(P.items[o.item]?'('+P.items[o.item].name+')':''));if(o.mode)d.push('mode='+o.mode);if(o.gate)d.push('gate='+o.gate);if(o.cond)d.push('cond='+o.cond);if(o.label)d.push('label='+o.label);if(o.face!=null)d.push('face='+o.face);if(o.cons)d.push('cons=1');
      s+=`| ${o.id} | ${o.type} | ${o.x} | ${o.y} | (${Math.floor(o.x*TPU)},${Math.floor(o.y*TPU)}) | ${d.join('; ')} |\n`}}
  return s+'\n'}
function exportAI(){

  s+='## 1. Block legend\n| char | block id | type | texture id | name | color | params |\n|---|---|---|---|---|---|---|\n'+P.blocks.map(b=>`| \`${b.ch}\` | ${b.id} | ${b.type} (${TYPES[b.type].jp}) | ${b.tex||''} | ${b.name} | ${b.col||''} | ${JSON.stringify(b.p||{})} |`).join('\n')+'\n';

  s+='\nTile "." = empty. Blocks with the same type but different texture id use different art (e.g. ground_a vs ground_b).\n\n';
  const tx={};for(const b of P.blocks)(tx[b.tex||'(none)']=tx[b.tex||'(none)']||[]).push(b.id);
  s+='## 2. Texture ids\n'+Object.entries(tx).map(([t,b])=>`- ${t}: ${b.join(', ')}`).join('\n')+'\n\n';
  s+='## 3. Areas\n'+Object.entries(P.areas).map(([k,a])=>`- ${k}: ${a.name} (${a.col})`).join('\n')+'\n\n';
  const rs=Object.values(P.rooms).sort((a,b)=>a.gy-b.gy||a.gx-b.gx);const lab={};rs.forEach((r,i)=>lab[r.id]=String(i+1).padStart(2,'0'));
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const r of rs){x0=Math.min(x0,r.gx);y0=Math.min(y0,r.gy);x1=Math.max(x1,r.gx+r.w-1);y1=Math.max(y1,r.gy+r.h-1)}
  s+='## 4. Overview map (cell grid; each number = room index, see list)\n```\n';for(let y=y0;y<=y1;y++){let l='';for(let x=x0;x<=x1;x++){const r=roomAtCell(x,y);l+=(r?lab[r.id]:'..')+' '}s+=l.trimEnd()+'\n'}s+='```\nColumns start at x='+x0+', rows start at y='+y0+'.\n\n';
  s+='## 5. Room list\n| # | id | name | area | cell | size | objects |\n|---|---|---|---|---|---|---|\n'+rs.map(r=>`| ${lab[r.id]} | ${r.id} | ${r.name} | ${r.area} | (${r.gx},${r.gy}) | ${r.w}x${r.h} | ${r.objs.length} |`).join('\n')+'\n\n';
  s+='## 6. Connections\n(a→b direction matters for kind=drop/oneway. tiles = opening range along that edge.)\n| id | from | to | kind | gate | req a→b | req b→a | a exit | b exit |\n|---|---|---|---|---|---|---|---|---|\n'+P.links.map(l=>`| ${l.id} | ${l.a} | ${l.b} | ${l.kind} | ${l.gate||''} | ${l.req||''} | ${l.rreq||''} | ${l.ea.side} ${l.ea.from}..${l.ea.to} | ${l.eb.side} ${l.eb.from}..${l.eb.to} |`).join('\n')+'\n\n';
  s+='## 7. Rooms\n\n'+rs.map(roomAI).join('');return s}

function importModal(){
  openModal('読み込み',`<div class="hint">次のどれでも読み込めます。<br>① 書き出したJSON（完全／軽量）　② <b>AI用Markdown</b>（「AI用に書き出し」の.md。AIが直したものも可）　③ 「現在の部屋だけ」の書き出し（現在のプロジェクトに追加／同じIDは上書き）。<br>①②は現在のプロジェクトを置き換えます（直前に自動で「版」を保存）。MarkdownにはテクスチャやIDの画像が含まれないため、同じブロックID・部屋IDの画像は現在のものを引き継ぎます。</div><input type="file" id="ifile" accept=".json,.md,.txt,text/plain,application/json,text/markdown"><textarea id="itxt" placeholder="ここにJSONまたはMarkdownを貼り付け" spellcheck="false"></textarea><div class="row"><button class="pri" id="igo">読み込む</button><span class="hint" id="imsg"></span></div>`,bd=>{

    let armed=false;$('#itxt').oninput=()=>{armed=false;$('#igo').textContent='読み込む'};
    $('#igo').onclick=async()=>{const t=$('#itxt').value.trim(),msg=$('#imsg');if(!t){msg.textContent='内容が空です';return}
      const kind=/^[\[{]/.test(t)?'json':/##\s*1\.\s*Block legend/.test(t)?'md':/^###\s/m.test(t)?'room':'?';
      if(kind==='?'){msg.textContent='形式が判別できません（JSON / AI用Markdown / 部屋単位Markdown）';return}

      if(!armed){armed=true;$('#igo').textContent='この内容で読み込む（もう一度押す）';msg.textContent=info+' '+w;return}

      try{if(kind==='room'){const r=importRoomsMd(t,false);commit();dirty=true;await saveNow();closeModal();refreshAll();toast(r.n+'部屋を反映しました'+(r.warn.length?`（注意${r.warn.length}件）`:''))}
        else{loadPacked(kind==='md'?pre.json:t);UI.room=null;UI.selRooms=[];UI.selLink=null;UI.selObj=null;commit();dirty=true;await saveNow();closeModal();setMode('over');fitView('over');toast('読み込みました'+(pre&&pre.warn&&pre.warn.length?`（注意${pre.warn.length}件）`:''))}}
      catch(e){msg.textContent='失敗: '+e.message}}})}

  <div><b>1. 概要マップ</b>：部屋は面（セル）で並びます。ドラッグで移動すると中身はそのまま、つながり(接続)だけ追従します。「つなぐ」ツールで部屋から部屋へドラッグすると接続が作れます。マウスを乗せると中身が大きく出ます。ダブルクリックで詳細へ。</div>

  <div><b>3. 全体マップ</b>：全部屋の実際の地形をつなげて確認します。</div>
  <div><b>4. 保存</b>：変更は自動でこのブラウザに保存されます。「版」で名前付きの控え、「AI用に書き出し」でMarkdown/JSONを取り出せます。</div>
  <table class="kv"><tr><td><kbd>P</kbd><kbd>E</kbd><kbd>L</kbd><kbd>R</kbd><kbd>F</kbd><kbd>I</kbd><kbd>S</kbd><kbd>O</kbd><kbd>B</kbd></td><td>鉛筆/消しゴム/直線/矩形/塗り/スポイト/範囲/物体/背景移動</td></tr>

    <div class="row" style="border-top:1px solid var(--line);padding-top:10px"><button id="b_dup">複製</button><button class="bad" id="b_del">このブロックを削除</button><span class="hint">削除すると配置済みの同ブロックは空になります</span></div>`,bd=>{

    $('#b_type').onchange=e=>{b.type=e.target.value;b.p={};if(bty(b)==='oneway')b.p.dir='R';if(bty(b)==='slope')b.p.shape='BR';if(bty(b)==='crumble')b.p.delay=30;blockModal();commit();refreshAll()};

/* ===== キー ===== */
const inField=e=>/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
addEventListener('keyup',e=>{if(e.code==='Space')spaceDown=false});
addEventListener('keydown',e=>{
  if(!M.hidden){if(e.key==='Escape')closeModal();return}
  if(inField(e))return;const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(e.code==='Space'){spaceDown=true;e.preventDefault();return}
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}if(mod&&k==='y'){e.preventDefault();redo();return}if(mod&&k==='s'){e.preventDefault();saveNow(false);return}
  if(k==='tab'){e.preventDefault();setMode({over:'room',room:'world',world:'over'}[UI.mode]);return}
  if(UI.mode==='over'){
    if(k==='m'&&!mod){if(!e.repeat)toggleMerge();return}
    if(UI.merge){if(k==='enter')doMerge();else if(k==='escape')toggleMerge(false);return}
    if(k==='delete'||k==='backspace'){if(UI.selLink){act('delLink')}else if(UI.selRooms.length){act('delRoom')}}
    else if(k==='enter'&&UI.selRooms[0])openRoom(UI.selRooms[0]);else if(k==='v'){UI.tool='sel';refreshPanels()}else if(k==='a'){UI.tool='add';refreshPanels()}else if(k==='c'&&!mod){UI.tool='link';refreshPanels()}else if(k==='escape'){drag=null;UI.selRooms=[];UI.selLink=null;refreshPanels()}
    return}
  if(UI.mode==='room'){const r=curRoom();if(!r)return;
    const tool={p:'pen',e:'erase',l:'line',r:'rect',f:'fill',i:'pick',s:'sel',o:'obj',b:'bg'}[k];
    if(tool&&!mod){if(UI.rtool==='sel'&&tool!=='sel'&&SEL){stampSel();SEL=null}UI.rtool=tool;refreshPanels();return}
    if(/^[1-9]$/.test(k)&&P.blocks[+k-1]){UI.blk=P.blocks[+k-1].id;if(!['pen','line','rect','fill'].includes(UI.rtool))UI.rtool='pen';refreshPanels();return}
    if(k==='v'){UI.preview=!UI.preview;refreshPanels();return}
    if(k==='g'){UI.showGrid=!UI.showGrid;refreshPanels();return}
    if(mod&&k==='c'&&SEL){clip=SEL.buf||selRows();toast('コピー');return}
    if(mod&&k==='x'&&SEL){clip=SEL.buf||selRows();if(!SEL.buf){clearSel();commit()}else SEL.buf=null;redraw();return}
    if(mod&&k==='v'&&clip){if(SEL&&SEL.buf)stampSel();const t=hoverT||[0,0];SEL={x:t[0],y:t[1],w:clip[0].length,h:clip.length,buf:clip.slice()};UI.rtool='sel';refreshPanels();e.preventDefault();return}
    if(k==='h'&&SEL){const rev=a=>a.map(s=>[...s].reverse().join(''));if(SEL.buf)SEL.buf=rev(SEL.buf);else{const rows=rev(selRows());rows.forEach((s,j)=>{for(let i=0;i<s.length;i++)setTile(r,SEL.x+i,SEL.y+j,s[i])});commit()}redraw();return}
    if(k==='enter'&&SEL&&SEL.buf){stampSel();redraw();return}
    if(k==='escape'){if(SEL&&SEL.buf){SEL.buf=null}SEL=null;UI.selObj=null;UI.selLink=null;refreshPanels();return}
    if(k==='delete'||k==='backspace'){if(SEL){if(SEL.buf)SEL.buf=null;else{clearSel();commit()}redraw()}else if(UI.selObj){act('delObj')}else if(UI.selLink){act('delLink')}return}
    const arrows={arrowleft:[-1,0],arrowright:[1,0],arrowup:[0,-1],arrowdown:[0,1]}[k];if(arrows&&UI.selObj){const o=r.objs.find(q=>q.id===UI.selObj);if(o){o.x+=arrows[0]/TPU;o.y+=arrows[1]/TPU;commit();refreshAll();e.preventDefault()}}}
  });
/* ===== 画像のドロップ/貼り付け ===== */
function dropImage(f){if(!f||!/^image\//.test(f.type))return false;
  if(UI.mode==='room'&&curRoom()){importImage(f,1600,id=>{const r=curRoom();r.bg={img:id,x:0,y:0,w:CW*r.w,alpha:1};commit();refreshAll();toast('背景に入れました')});return true}
  if(UI.mode==='over'){importImage(f,1600,id=>{P.mapBg={img:id,x:0,y:0,scale:1,alpha:.5};commit();refreshAll();toast('下絵に入れました')});return true}return false}
const stg=$('#stage');stg.addEventListener('dragover',e=>e.preventDefault());stg.addEventListener('drop',e=>{e.preventDefault();dropImage(e.dataTransfer.files[0])});
addEventListener('paste',e=>{if(inField(e)||!M.hidden)return;const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it){e.preventDefault();dropImage(it.getAsFile())}});
/* ===== 起動 ===== */
addEventListener('resize',()=>{sizeCanvas();if(UI.mode==='room'&&0)fitRoom()});
new ResizeObserver(sizeCanvas).observe($('#stage'));
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{readTheme();redraw()});
window.__atb={ser:()=>ser()};
(async function main(){
  try{const t=localStorage.getItem('atb-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
  try{const t=JSON.parse(localStorage.getItem('atb-tabs')||'null');if(t){UI.openL=!!t.l;UI.openR=!!t.r;UI.rtab=t.t==='check'?'check':'detail'}}catch(e){}
  if(innerWidth<=980){UI.openL=false;UI.openR=false}
  readTheme();let loaded=false;
  try{const raw=await kvGet('project');if(raw){loadPacked(raw);loaded=true}}catch(e){console.warn(e)}
  if(!loaded){P=newProject(SEED);reidx();last=ser()}
  sizeCanvas();$('#projName').value=P.name;setMode('over');fitView('over');updUndo();
  chip(loaded?'保存済み（前回の続き）':'試作版の部屋を読み込み済み');dirty=false;
  if(!loaded){dirty=true;chip('未保存の変更あり');saveNow(true)}
})();


})();
